
<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk WhatsApp Messenger</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }
        h2 {
            text-align: center;
            color: #075e54;
        }
        label {
            font-weight: bold;
            margin-top: 15px;
            display: block;
        }
        textarea, input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #25d366;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }
        button:hover {
            background-color: #128c7e;
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            background-color: #e9f5ec;
            color: #075e54;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>WhatsApp Bulk Sender</h2>

    <label for="numbers">ഫോൺ നമ്പറുകൾ (Country code അടക്കം, ഉദാ: 919876543210):</label>
    <textarea id="numbers" rows="5" placeholder="919876543210&#10;919876543211&#10;919876543212"></textarea>

    <label for="message">സന്ദേശം (Message):</label>
    <textarea id="message" rows="4" placeholder="നിങ്ങളുടെ സന്ദേശം ഇവിടെ ടൈപ്പ് ചെയ്യുക..."></textarea>

    <label for="interval">ഇടവേള (Interval):</label>
    <select id="interval">
        <option value="60">1 മിനിറ്റ് (60 സെക്കൻഡ്)</option>
        <option value="30">30 സെക്കൻഡ്</option>
        <option value="120">2 മിനിറ്റ് (120 സെക്കൻഡ്)</option>
    </select>

    <button onclick="startSending()">Start Sending</button>

    <div id="status" class="status"></div>
</div>

<script>
    let timer = null;

    function startSending() {
        const numbersInput = document.getElementById("numbers").value.trim();
        const message = encodeURIComponent(document.getElementById("message").value.trim());
        const intervalSec = parseInt(document.getElementById("interval").value) * 1000;
        const statusDiv = document.getElementById("status");

        if (!numbersInput || !message) {
            alert("ദയവായി നമ്പറുകളും സന്ദേശവും നൽകുക!");
            return;
        }

        // നമ്പറുകളെ വരി അല്ലെങ്കിൽ കോമ അനുസരിച്ച് വേർതിരിക്കുന്നു
        let numbersList = numbersInput.split(/[\n,]+/).map(num => num.trim().replace(/[^0-9]/g, '')).filter(num => num.length > 5);

        if (numbersList.length === 0) {
            alert("സാധുവായ ഫോൺ നമ്പറുകൾ ഒന്നും ലഭിച്ചില്ല.");
            return;
        }

        statusDiv.style.display = "block";
        let currentIndex = 0;

        function sendNext() {
            if (currentIndex >= numbersList.length) {
                statusDiv.innerText = "എല്ലാ സന്ദേശങ്ങളും അയച്ചു കഴിഞ്ഞു!";
                clearInterval(timer);
                return;
            }

            let phone = numbersList[currentIndex];
            let url = `https://wa.me/${phone}?text=${message}`;

            // പുതിയ ടാബിൽ WhatsApp തുറക്കുന്നു
            window.open(url, '_blank');

            currentIndex++;
            statusDiv.innerText = `അയക്കുന്നു: ${currentIndex} / ${numbersList.length} (അടുത്തത് ${intervalSec/1000} സെക്കൻഡിനുള്ളിൽ...)`;
        }

        // ആദ്യ സന്ദേശം ഉടൻ അയക്കുന്നു, തുടർന്ന് സെറ്റ് ചെയ്ത സമയം അനുസരിച്ച്
        sendNext();
        timer = setInterval(sendNext, intervalSec);
    }
</script>

</body>
</html>

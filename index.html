<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Bulk Sender - Tomato Delivery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #075e54;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }
        textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #25d366;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }
        .btn-sync {
            background-color: #007bff;
            margin-bottom: 15px;
        }
        .btn-sync:hover {
            background-color: #0056b3;
        }
        button:hover {
            background-color: #128c7e;
        }
        .file-input-box {
            background: #e9ecef;
            padding: 10px;
            border-radius: 5px;
            margin-top: 5px;
        }
        .dashboard {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .list-box {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            max-height: 250px;
            overflow-y: auto;
            background: #fafafa;
        }
        .list-box h3 {
            margin-top: 0;
            font-size: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
        .item {
            font-size: 13px;
            margin-bottom: 8px;
            padding: 5px;
            background: #fff;
            border-radius: 3px;
            border-left: 3px solid #ccc;
        }
        .item.sent {
            border-left-color: #25d366;
        }
        .item.pending {
            border-left-color: #ff9800;
        }
        .status-tracker {
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
            color: #075e54;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>WhatsApp Bulk Sender</h2>

    <!-- Google Sheet Sync Button -->
    <button class="btn-sync" onclick="fetchFromSheet()">Google Sheet-ൽ നിന്ന് ഡാറ്റ കൊണ്ടുവരിക</button>

    <label for="dataInput">കടകളുടെ വിവരങ്ങൾ (കടയുടെ പേര്, സ്ഥലം, ഫോൺ നമ്പർ):</label>
    <textarea id="dataInput" rows="6" placeholder="ഡാറ്റ ഇവിടെ ടൈപ്പ് ചെയ്യുക അല്ലെങ്കിൽ മുകളിലെ ബട്ടൺ അമർത്തുക..."></textarea>

    <label for="message">സന്ദേശം (Message):</label>
    <textarea id="message" rows="3" placeholder="നിങ്ങളുടെ സന്ദേശം ഇവിടെ നൽകുക..."></textarea>

    <label>ഫോട്ടോ / വീഡിയോ അയക്കാൻ (Optional):</label>
    <div class="file-input-box">
        <input type="file" id="mediaFile" accept="image/*,video/*">
        <p style="font-size: 11px; color: #666; margin: 5px 0 0 0;">ശ്രദ്ധിക്കുക: വാട്ട്‌സ്ആപ്പ് ഓപ്പൺ ആയി വരുമ്പോൾ അറ്റാച്ച്‌മെന്റ് വഴി നിങ്ങൾ സെലക്ട് ചെയ്ത ഫോട്ടോ/വീഡിയോ അയക്കുക.</p>
    </div>

    <label for="interval">ഇടവേള (Interval):</label>
    <select id="interval">
        <option value="60">1 മിനിറ്റ് (60 സെക്കൻഡ്)</option>
        <option value="30">30 സെക്കൻഡ്</option>
        <option value="120">2 മിനിറ്റ്</option>
    </select>

    <button onclick="startProcess()">Start Sending</button>

    <div id="statusTracker" class="status-tracker"></div>

    <div class="dashboard">
        <div class="list-box">
            <h3>അയക്കാനുള്ളവ (<span id="pendingCount">0</span>)</h3>
            <div id="pendingList"></div>
        </div>
        <div class="list-box">
            <h3>അയച്ചവ (<span id="sentCount">0</span>)</h3>
            <div id="sentList"></div>
        </div>
    </div>
</div>

<script>
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzuZInAVz_ojoNkuhJyq1bsn32jRX6iCCS9Fl_JKgIWEklWhjIN0dDvdEyWHykdcG/exec";

    function fetchFromSheet() {
        document.getElementById("statusTracker").innerText = "Google Sheet-ൽ നിന്ന് ഡാറ്റ എടുക്കുന്നു...";

        fetch(SHEET_API_URL)
            .then(res => res.json())
            .then(data => {
                let formattedText = "";
                // Row 0 Header ആണ് (hotel name, please, etc.), അതിനാൽ i = 1 മുതൽ തുടങ്ങുന്നു
                for (let i = 1; i < data.length; i++) {
                    let row = data[i];
                    if (!row || row.length === 0) continue;

                    let name = row[0] ? String(row[0]).trim() : "";
                    let type = row[1] ? String(row[1]).trim() : "";
                    let place = row[2] ? String(row[2]).trim() : "";
                    // Column E (Index 4) ആണ് phone number
                    let phone = row[4] ? String(row[4]).trim() : "";

                    // ഫോൺ നമ്പർ ഇല്ലെങ്കിൽ മറ്റ് സെല്ലുകളിൽ നമ്പർ ഉണ്ടോ എന്ന് ചെക്ക് ചെയ്യുന്നു
                    if (!phone) {
                        row.forEach(cell => {
                            let cleanNum = String(cell).replace(/[^0-9]/g, '');
                            if (cleanNum.length >= 10 && !phone) {
                                phone = cleanNum;
                            }
                        });
                    }

                    if (name || phone) {
                        let combinedPlace = place ? (type ? type + ' - ' + place : place) : type;
                        formattedText += `${name}, ${combinedPlace}, ${phone}\n`;
                    }
                }

                document.getElementById("dataInput").value = formattedText;
                document.getElementById("statusTracker").innerText = "ഡാറ്റ വിജയകരമായി ഡൗൺലോഡ് ചെയ്തു!";
            })
            .catch(err => {
                console.error(err);
                alert("ഡാറ്റ ലോഡ് ചെയ്യുന്നതിൽ പിശക് സംഭവിച്ചു.");
                document.getElementById("statusTracker").innerText = "";
            });
    }

    let queue = [];
    let sentItems = [];
    let timer = null;

    function startProcess() {
        const rawData = document.getElementById("dataInput").value.trim();
        const baseMessage = document.getElementById("message").value.trim();
        const intervalSec = parseInt(document.getElementById("interval").value) * 1000;

        if (!rawData || !baseMessage) {
            alert("ദയവായി വിവരങ്ങളും സന്ദേശവും നൽകുക!");
            return;
        }

        const lines = rawData.split('\n');
        queue = [];
        sentItems = [];

        lines.forEach(line => {
            const parts = line.split(',');
            let name = "Customer";
            let place = "";
            let phone = "";

            parts.forEach(part => {
                let cleanPart = part.trim();
                let nums = cleanPart.replace(/[^0-9]/g, '');
                if (nums.length >= 10 && !phone) {
                    phone = nums;
                } else if (!name || name === "Customer") {
                    name = cleanPart;
                } else {
                    place += (place ? " " : "") + cleanPart;
                }
            });

            if (phone) {
                if (!phone.startsWith("91") && phone.length === 10) {
                    phone = "91" + phone;
                }
                queue.push({ name, place, phone });
            }
        });

        if (queue.length === 0) {
            alert("ശ്രദ്ധിക്കുക: ഫോൺ നമ്പർ ഉള്ള എൻട്രികൾ ഒന്നും കണ്ടെത്തിയില്ല! (ഷീറ്റിൽ ബാക്കി ഫോൺ നമ്പറുകൾ കൂടി ചേർത്ത ശേഷം ശ്രമിക്കുക)");
            return;
        }

        updateDashboard();
        
        if (timer) clearInterval(timer);
        sendNext(baseMessage, intervalSec);
        timer = setInterval(() => sendNext(baseMessage, intervalSec), intervalSec);
    }

    function sendNext(baseMessage, intervalSec) {
        if (queue.length === 0) {
            document.getElementById("statusTracker").innerText = "എല്ലാ സന്ദേശങ്ങളും അയച്ചു കഴിഞ്ഞു!";
            clearInterval(timer);
            return;
        }

        const currentItem = queue.shift();
        sentItems.push(currentItem);

        let customizedMsg = `ഹലോ ${currentItem.name}`;
        if (currentItem.place) {
            customizedMsg += ` (${currentItem.place})`;
        }
        customizedMsg += `,\n\n${baseMessage}`;

        const url = `https://wa.me/${currentItem.phone}?text=${encodeURIComponent(customizedMsg)}`;

        window.open(url, '_blank');

        updateDashboard();
        document.getElementById("statusTracker").innerText = `അടുത്ത സന്ദേശം ${intervalSec/1000} സെക്കൻഡിൽ അയക്കും...`;
    }

    function updateDashboard() {
        document.getElementById("pendingCount").innerText = queue.length;
        document.getElementById("sentCount").innerText = sentItems.length;

        document.getElementById("pendingList").innerHTML = queue.map(item => 
            `<div class="item pending"><b>${item.name}</b> ${item.place ? '(' + item.place + ')' : ''}<br>${item.phone}</div>`
        ).join('');

        document.getElementById("sentList").innerHTML = sentItems.map(item => 
            `<div class="item sent"><b>${item.name}</b> ${item.place ? '(' + item.place + ')' : ''}<br>${item.phone}</div>`
        ).join('');
    }
</script>

</body>
</html>

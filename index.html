<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Bulk Sender - Tomato Delivery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #075e54; margin-bottom: 20px; }
        label { font-weight: bold; margin-top: 15px; display: block; }
        textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #25d366;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }
        .btn-sync { background-color: #007bff; margin-bottom: 15px; }
        .btn-send-next {
            background-color: #128c7e;
            font-size: 18px;
            padding: 15px;
            margin-top: 15px;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .cards-container {
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 5px;
            background: #fdfdfd;
        }
        .store-card {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-left: 5px solid #007bff;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
        }
        .dashboard { display: flex; gap: 10px; margin-top: 20px; }
        .list-box {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            max-height: 180px;
            overflow-y: auto;
            background: #fafafa;
        }
        .item { font-size: 12px; margin-bottom: 6px; padding: 5px; background: #fff; border-radius: 3px; border-left: 3px solid #ccc; }
        .item.sent { border-left-color: #25d366; }
        .item.pending { border-left-color: #ff9800; }
        .status-tracker { text-align: center; font-weight: bold; margin-top: 15px; color: #075e54; }
    </style>
</head>
<body>

<div class="container">
    <h2>WhatsApp Bulk Sender</h2>

    <button class="btn-sync" onclick="fetchFromSheet()">Google Sheet-ൽ നിന്ന് ഡാറ്റ കൊണ്ടുവരിക</button>

    <label>കടകളുടെ വിവരങ്ങൾ:</label>
    <div id="cardsContainer" class="cards-container">
        <p style="text-align: center; color: #888; font-size: 13px;">ഡാറ്റ ലോഡ് ചെയ്യാൻ മുകളിലെ ബട്ടൺ അമർത്തുക...</p>
    </div>

    <label for="message">സന്ദേശം (Message):</label>
    <textarea id="message" rows="3" placeholder="അയക്കേണ്ട സന്ദേശം മാത്രം ഇവിടെ ടൈപ്പ് ചെയ്യുക..."></textarea>

    <button id="startBtn" onclick="startProcess()">Start Bulk Sending</button>

    <!-- Send Next Action Button -->
    <button id="sendNextBtn" class="btn-send-next" onclick="sendToCurrent()"></button>

    <div id="statusTracker" class="status-tracker"></div>

    <div class="dashboard">
        <div class="list-box">
            <h3>അയക്കാനുള്ളവ (<span id="pendingCount">0</span>)</h3>
            <div id="pendingList"></div>
        </div>
        <div class="list-box">
            <h3>അയച്ചവ (<span id="sentCount">0</span>)</h3>
            <div id="sentList"></div>
        </div>
    </div>
</div>

<script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/1MZFEXa8rNwYPGA5ptfcKTEoHWCE-uVVpL0PvE2CpmMA/gviz/tq?tqx=out:csv";
    let fetchedStores = [];
    let queue = [];
    let sentItems = [];
    let currentStore = null;

    function fetchFromSheet() {
        document.getElementById("statusTracker").innerText = "Google Sheet-ൽ നിന്ന് ഡാറ്റ എടുക്കുന്നു...";
        fetch(CSV_URL)
            .then(res => res.text())
            .then(csvText => parseCSVAndFill(csvText))
            .catch(err => {
                alert("ഡാറ്റ ലോഡ് ചെയ്യുന്നതിൽ പിശക് സംഭവിച്ചു!");
                document.getElementById("statusTracker").innerText = "";
            });
    }

    function parseCSVAndFill(csvText) {
        let lines = csvText.split('\n');
        fetchedStores = [];

        for (let i = 1; i < lines.length; i++) {
            let row = lines[i].split(',').map(cell => cell.replace(/^"|"$/g, '').trim());
            if (row.length < 1 || !row.join('')) continue;

            let name = row[0] || "കട";
            let type = row[1] || "";
            let place = row[2] || "";
            let phone = row[4] || "";

            if (!phone) {
                row.forEach(cell => {
                    let cleanNum = cell.replace(/[^0-9]/g, '');
                    if (cleanNum.length >= 10 && !phone) phone = cleanNum;
                });
            }

            if (name || phone) fetchedStores.push({ name, type, place, phone });
        }

        renderCards();
    }

    function renderCards() {
        const container = document.getElementById("cardsContainer");
        if (fetchedStores.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: red;">ഡാറ്റ ലഭിച്ചില്ല.</p>';
            return;
        }

        container.innerHTML = fetchedStores.map(store => `
            <div class="store-card">
                <b>${store.name}</b> ${store.type ? '(' + store.type + ')' : ''}<br>
                <small>📍 ${store.place || 'N/A'} | 📞 ${store.phone || 'No Number'}</small>
            </div>
        `).join('');

        document.getElementById("statusTracker").innerText = `ആകെ ${fetchedStores.length} കടകളുടെ വിവരങ്ങൾ ലോഡ് ചെയ്തു!`;
    }

    function startProcess() {
        const baseMessage = document.getElementById("message").value.trim();

        if (fetchedStores.length === 0) {
            alert("ആദ്യം Google Sheet-ൽ നിന്ന് ഡാറ്റ കൊണ്ടുവരിക!");
            return;
        }
        if (!baseMessage) {
            alert("ദയവായി അയക്കേണ്ട സന്ദേശം ടൈപ്പ് ചെയ്യുക!");
            return;
        }

        queue = [];
        sentItems = [];

        fetchedStores.forEach(store => {
            let cleanPhone = store.phone.replace(/[^0-9]/g, '');
            if (cleanPhone.length >= 10) {
                if (!cleanPhone.startsWith("91") && cleanPhone.length === 10) cleanPhone = "91" + cleanPhone;
                queue.push({ name: store.name, place: store.place, phone: cleanPhone });
            }
        });

        if (queue.length === 0) {
            alert("ഫോൺ നമ്പർ ഉള്ള കടകൾ ഒന്നും കണ്ടെത്തിയില്ല!");
            return;
        }

        document.getElementById("startBtn").style.display = "none";
        updateDashboard();
        prepareNext();
    }

    function prepareNext() {
        const sendNextBtn = document.getElementById("sendNextBtn");

        if (queue.length === 0) {
            sendNextBtn.style.display = "none";
            document.getElementById("statusTracker").innerText = "🎉 എല്ലാ സന്ദേശങ്ങളും അയച്ചു കഴിഞ്ഞു!";
            document.getElementById("startBtn").style.display = "block";
            return;
        }

        currentStore = queue.shift();
        sendNextBtn.innerText = `📲 Send Message to: ${currentStore.name}`;
        sendNextBtn.style.display = "block";
        document.getElementById("statusTracker").innerText = `അടുത്തത്: ${currentStore.name}`;
    }

    function sendToCurrent() {
        if (!currentStore) return;

        const baseMessage = document.getElementById("message").value.trim();
        const url = `whatsapp://send?phone=${currentStore.phone}&text=${encodeURIComponent(baseMessage)}`;

        window.location.href = url;

        sentItems.push(currentStore);
        updateDashboard();

        setTimeout(() => {
            prepareNext();
        }, 1000);
    }

    function updateDashboard() {
        document.getElementById("pendingCount").innerText = queue.length;
        document.getElementById("sentCount").innerText = sentItems.length;

        document.getElementById("pendingList").innerHTML = queue.map(item => 
            `<div class="item pending"><b>${item.name}</b><br>${item.phone}</div>`
        ).join('');

        document.getElementById("sentList").innerHTML = sentItems.map(item => 
            `<div class="item sent"><b>${item.name}</b><br>${item.phone}</div>`
        ).join('');
    }
</script>

</body>
</html>
